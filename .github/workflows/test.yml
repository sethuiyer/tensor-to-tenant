name: Tests

# One end-to-end quality gate: schema -> generated views -> Astro -> Cookiecutter -> tests.

"on":
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: false

jobs:
  quality:
    name: Schema, site, and Cookiecutter quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test and schema dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest pytest-cov cookiecutter

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate canonical schema
        run: python tools/validate_schema.py

      - name: Generate and verify deterministic views
        run: |
          python tools/generate_capstones.py
          python tools/generate.py
          git diff --exit-code -- \
            src/data \
            CAPSTONE3_OPENROUTER.md \
            cookiecutter/hooks/curriculum_generated.py \
            cookiecutter/'"'"'{{cookiecutter.repo_name}}'"'"'/.curriculum_generated.py

      - name: Build Astro site and run structural drift checks
        run: npm run build

      - name: Render Cookiecutter artifact
        run: |
          output_dir="$(mktemp -d)"
          cookiecutter cookiecutter --no-input --output-dir "$output_dir"
          test -d "$output_dir/tensor-to-tenant-journal"

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short

      - name: Re-check schema/site drift
        run: python tools/drift_report.py

      - name: Coverage report
        if: success()
        run: python -m pytest tests/ --cov=cookiecutter --cov-report=term-missing --cov-report=xml
