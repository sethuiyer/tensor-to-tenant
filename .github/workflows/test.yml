name: Tests

# Runs the test harness on every push to any branch and every PR.
# Currently scoped to the cookiecutter generator's pure-Python
# primitives (TASKS.md T1.4.a). Expands as T1.4.b–f land.

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Same concurrency policy as deploy.yml: do not cancel in-progress runs.
concurrency:
  group: tests
  cancel-in-progress: false

jobs:
  generator-tests:
    name: Cookiecutter generator tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Coverage report
        if: success()
        run: |
          python -m pytest tests/ \
            --cov=cookiecutter \
            --cov-report=term-missing \
            --cov-report=xml \
            -q 2>/dev/null || true

  # Site-build smoke check. Cheap insurance that the Astro build
  # hasn't broken since the last deploy. Expands to full schema drift
  # once T1.6 lands.
  site-build:
    name: Astro site build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  # When both jobs above exist, they run in parallel.
