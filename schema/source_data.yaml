  - weeks: 38–45
    theme: Fenwick, segment trees, range queries, sketches, DSU, randomized hashing
    tier: Core
    artifact: Range-query or routing primitive; Week 45 mini-contest
  - weeks: 46–52
    theme: Graph representation, BFS/DFS, SCC, topological sort, shortest paths
    tier: Core
    artifact: Dependency graph or routing implementation
  - weeks: 53–57
    theme: MST, Euler paths, max flow, min-cost flow, matching
    tier: Core / Supporting
    artifact: Resource-allocation design; Week 57 graph boss fight
