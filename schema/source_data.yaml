  AGENT_BRIDGES:
  - module: '1'
    title: Exploring the Generative AI Universe
    gap: Module 1 gives you the *what*. tensor-to-tenant gives you the *why* — the math in Weeks 7–10, the primitives in Weeks
      31–33, and the production LLM/RAG work in Weeks 70–81.
    rows:
    - concept: Embeddings & what a model "is"
      weeks: Weeks 7–10
      insight: Linear algebra and vector geometry that actually produce embeddings — the math under the vocabulary.
    - concept: Model parameters & training intuition
      weeks: Weeks 31–33
      insight: Engineering micro-projects where you build ML primitives from scratch; parameters stop being magic.
    - concept: RAG at a high level
      weeks: Week 70
      insight: The LLM+RAG phase starts here; you build retrieval pipelines rather than hear a definition.
    - concept: AI agents overview
      weeks: Weeks 79, 81
      insight: The agents weeks where the "agent" label gets an actual implementation.
  - module: '2'
    title: AI Agent Prototyping (No-Code Introduction)
    gap: The no-code drag-and-drop hides the machine. Week 6 shows you the shape, Week 51 shows you the deployment reality,
      and Week 81 shows you the compiled version.
    rows:
    - concept: What an agent does (no-code view)
      weeks: Week 6
      insight: Orientation weeks where you diagnose tooling and the shape of an agent loop before writing code.
    - concept: Deployment strategies for no-code agents
      weeks: Week 51
      insight: 'Distributed systems: how services actually get deployed and connected.'
    - concept: Agent capabilities without programming
      weeks: Week 81
      insight: The agents phase — you now know what those drag-and-drop nodes compile to.
  - module: '3'
    title: Coding Essentials for AI Programming
    gap: Coding essentials give you the vocabulary. Weeks 2–4, 47, 52, and 81 show you what the vocabulary actually compiles
      to.
    rows:
    - concept: Python data structures, async & error handling
      weeks: Weeks 2–4
      insight: The tooling phase where you implement the primitives those frameworks wrap.
    - concept: SQL & database frameworks
      weeks: Week 47
      insight: 'System design: data modeling, schema, and storage engines.'
    - concept: Interacting with APIs
      weeks: Week 52
      insight: 'Distributed patterns: request/response, contracts, and failure handling.'
    - concept: Web frameworks & agent tooling
      weeks: Week 81
      insight: The agents phase where those Flask/FastAPI skills become agent tool servers.
  - module: '4'
    title: Introduction to LangChain
    gap: LangChain gives you chains. Weeks 37, 79–80, and 98 give you the composition, state, and production discipline those
      chains need.
    rows:
    - concept: LCEL & composable chains
      weeks: Week 37
      insight: 'Engineering primitives: composing small, testable units — the same discipline as pipeline composition.'
    - concept: Model I/O & the LLM abstraction
      weeks: Week 79
      insight: 'The LLM/RAG phase: you build the abstraction and understand its cost.'
    - concept: Memory & conversational apps
      weeks: Week 80
      insight: RAG and memory systems — state management under the hood.
    - concept: Chains in production
      weeks: Week 98
      insight: 'Production AI platform: multi-tenant accounting and reliability for LLM pipelines.'
  - module: '5'
    title: Prompt Engineering Essentials
    gap: Prompting is the surface. Weeks 5, 61, 73, and 79 explain why the surface behaves the way it does.
    rows:
    - concept: Prompt patterns & persona
      weeks: Week 5
      insight: 'Hypothesis choice: how you phrase an experiment changes the result.'
    - concept: Chain of Thought
      weeks: Week 73
      insight: LLM training/RAG — why reasoning traces work, from the model’s perspective.
    - concept: Self Consistency
      weeks: Week 61
      insight: 'Experimentation and evaluation: sampling, variance, and aggregation.'
    - concept: Prompting with external tools
      weeks: Week 79
      insight: 'Agents week: tool-calling contracts and the ReAct loop.'
  - module: '6'
    title: RAG Systems Essentials
    gap: RAG modules show you retrieval. Weeks 31–33 and 75–78 show you the index, the pipeline, and the failure modes.
    rows:
    - concept: Vector databases
      weeks: Weeks 31–33
      insight: Build embedding/vector primitives from scratch — you stop trusting the index and build one.
    - concept: Chunking & document processing
      weeks: Week 36
      insight: 'ML micro-projects: tokenization and preprocessing with measurable trade-offs.'
    - concept: Retrieval strategies
      weeks: Weeks 75–78
      insight: 'The RAG weeks: retrieval pipelines, hybrid search, and evaluation at depth.'
    - concept: Hallucination mitigation
      weeks: Weeks 75–78
      insight: Grounding, attribution, and evaluation — the why behind CRAG and self-RAG.
  - module: '7'
    title: Building AI Agents from Scratch & Graph-RAG
    gap: Building agents from scratch teaches the loop. Weeks 37, 73, 77, 81 and the Forge’s graph theory teach the structure
      that makes the loop correct.
    rows:
    - concept: ReAct loop from scratch
      weeks: Week 37
      insight: 'Engineering primitives: the loop as a concrete, testable program.'
    - concept: Reflection pattern
      weeks: Week 73
      insight: 'LLM evaluation: self-critique and feedback loops.'
    - concept: Graph RAG with Cypher
      weeks: Week 77
