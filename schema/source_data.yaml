  BRIDGE_PITCH:
    quote: Do Modules 1–18 + Manus capstone in 16 weeks. You'll be an agent builder who can ship. Then, when you hit the ceiling
      — when your RAG pipeline breaks at 10k QPS, when your AutoGen crew deadlocks, when your DSPy optimizer converges to
      garbage — tensor-to-tenant is waiting. Weeks 22, 38, 57, 75, 88, 98, 99, 102. That's where the ceiling becomes a floor.
    tag: This is the bridge. Not a merge. A ladder.
  MANUS_CAPSTONE:
    title: Project Manus - Agentic UI Automation
    vision: Develop a sophisticated AI agent capable of understanding and autonomously operating both web-based GUIs and CLIs
      to achieve complex, multi-step user goals.
    features:
    - LLM-driven decision-making for action selection and planning
    - Sophisticated message management for internal state
    - Advanced web browser automation with DOM understanding
    - Robust terminal emulation with WebSocket interaction
    - Text editing capabilities for configuration files
    - Server infrastructure with API endpoints
    - Comprehensive logging and telemetry
    architecture:
    - Central Orchestration Service
    - Modular Tool Interface
    - Browser Interaction Module (Playwright/Selenium)
    - Terminal Interaction Module
    - State Management with LangGraph
    - Prompt Engineering / DSPy Signatures
    learningFocus: Integration of all course concepts including LangChain, LangGraph, AutoGen, CrewAI, DSPy, MCP, and Kùzu.
    challenges:
    - Robust DOM interpretation without brittle selectors
    - State management across different tools
    - Error recovery in complex workflows
    - Adaptation to UI changes
    - Security considerations for UI automation
    evaluation:
    - Correctness and completeness of task execution
    - Robustness and error handling capabilities
    - Code quality and architectural design
    - Integration of course concepts
    - Presentation and documentation quality
    extensions:
    - Multi-user support with session isolation
    - Integration with Model Context Protocol
    - Self-optimization using DSPy
    - Knowledge graph integration with Kùzu
    - Advanced planning and reflection mechanisms
    stack:
    - LangGraph
    - DSPy
    - MCP
    - Kùzu
    - Playwright/Selenium
darbar:
  DARBAR_PATTERNS:
  - name: Timed routing
    weeks: 1–15
    slots: 1–120
    tips: Two-pointer scanning, map-based lookups, prefix products, interval merging
    warmup: LeetCode-style easy problems (15 min each)
    core: Data-structure and string/array basics under a clock
    exam: Weekly timed block, 3–5 problems in 60 minutes
  - name: State machines & simulations
    weeks: 16–30
    slots: 121–200
    tips: Transition tables, cycle detection in simulation, stack/queue state
    warmup: Simulation and state-transition drills
    core: Problems whose solution is a disciplined state machine
    exam: 2–3 state-machine problems in 60 minutes
  - name: Tree & graph fluency
    weeks: 31–45
    slots: 201–280
    tips: DFS/BFS patterns, subtree invariants, shortest-path frames, topo order
    warmup: Tree traversals and adjacency-list graph walks
    core: Tree and graph problems across difficulty bands
    exam: Tree+graph block with one design flavored problem
  - name: Data-structure mastery
    weeks: 46–60
    slots: 281–360
    tips: Heaps, Fenwick/segment trees, tries, DSU, balanced structures
    warmup: Standard-library structure drills
    core: Problems that pick the right structure by workload shape
    exam: Structure-selection exam with 2–3 advanced problems
  - name: Advanced & interview fusion
    weeks: 61–90
    slots: 361–470
    tips: DP, greedy, sliding-window optimizations, offline queries
    warmup: Classic DP and greedy patterns
    core: Fusion problems that combine two or more techniques
    exam: Mixed 4-problem block mirroring a real interview
  - name: Mock & personal gauntlet
    weeks: 91–108
    slots: 471–548
    tips: Full mock interviews, random pick from all patterns, time pressure
    warmup: Two-problem blocks (45 min)
    core: Company-tagged and previously missed problems
    exam: Full mock interviews scored on a rubric
  DARBAR_PACING:
    totalSlots: 548
    standardTarget: One “Standard” solve path to keep the 108-week core viable.
    aurorTarget: Solve, explain, and timebox all 548 catalog slots.
    weeklyCadence: 3–5 problems per week across the pattern blocks.
  DARBAR_CATALOG:
    easy: 255
    medium: 240
    hard: 53
    tagline: 548 hand-crafted picks covering the full data-structure and algorithm spectrum.
    link: https://aninokuma.codeberg.page/leetcode-darbar/
  DARBAR_PACING_MAP:
  - weeks: 1–6
    emphasis: Arrays, strings, hash tables, stacks, queues, searching/sorting
    production: Python engineering, APIs, diagnostics
  - weeks: 7–30
    emphasis: Math, bit manipulation, divide and conquer, recursion, backtracking
    production: Linear algebra, probability, statistics, optimization
  - weeks: 31–45
    emphasis: Heaps, linked lists, tries, range queries, hashing
    production: Retrieval, Top-K, caching, sketches, routing
  - weeks: 46–57
    emphasis: Graphs, trees, greedy, DSU, range queries
    production: System design, workflows, sharding, scheduling
  - weeks: 58–69
    emphasis: Dynamic programming, greedy, math, probability
    production: Experiment assignment, rollouts, monitoring
  - weeks: 70–81
    emphasis: Strings, tries, graphs, sequence DP
    production: Tokenization, retrieval, agents, guardrails
  - weeks: 82–102
    emphasis: Heaps, priority queues, graphs, trees, range queries
    production: Inference schedulers, quotas, queues, tenant fairness
  - weeks: 103–108
    emphasis: Mixed timed sets and mock interviews
    production: Mo's traces, Euler/DSU boss, portfolio defense
  DARBAR_TRIANGULATION:
  - concept: Heap
    speed: Top-K and scheduler problems
    depth: Heap invariants and adversarial streams
    artifact: Streaming Top-K / inference batching
  - concept: Trees
    speed: Traversal, LCA, tree DP
    depth: Euler Tour, HLD, DSU on Tree
    artifact: Agent-execution forensics
  - concept: Graphs
    speed: BFS/DFS and shortest paths
    depth: SCC, flow, matching, min-cost flow
    artifact: Workflow and routing platform
  - concept: Strings
    speed: Prefix matching and tries
    depth: KMP, Aho-Corasick, suffix structures
    artifact: PII detector / retrieval index
  - concept: Hashing
    speed: Frequency and lookup patterns
    depth: Consistent/rendezvous hashing
    artifact: Tenant-aware routing and caches
  DARBAR_OPERATING_RULE:
  - 'Mon–Thu: one catalog problem per day'
  - 'Fri: one timed problem or contest set'
  - 'Weekend: review, editorial rewrite, or recovery'
  DARBAR_CATEGORIES:
  - array
  - backtracking
  - bit manipulation
  - divide and conquer
  - dynamic programming
  - graphs
  - greedy
  - hash table
  - heap
  - linked list
  - math
  - queue
  - range query
  - recursion
  - searching and sorting
  - stack
  - string
  - trees
  - trie
  DARBAR_PRINCIPLES:
  - 'Rigor with sanity: prioritize problems that force the phase’s algorithms.'
  - 'Timer on, then review: solve under a clock, then study the editorial regardless of outcome.'
  - 'Evidence per slot: one file that proves the attempt, the solution, and the complexity note.'
  - 'Patterns before volume: mastery is choosing the right tool for the workload, not memorizing solutions.'
  - 'Mock pressure from week one: the timed block is a permanent part of the ritual.'
  - 'Auror track is optional: the 548-slot catalog is depth; the 108-week path never depends on it.'
deepDives:
  TOOL_RECOMMENDATION_SYSTEMS:
    crossReferences:
    - role: shares the agent-tool graph model
      track: agents
    - role: shares Recall@K / MRR evaluation
      track: darbar
    - role: shares graph-traversal algorithmic depth
      track: forge
    - capstone: 3
      role: shares the multi-signal routing pattern
    id: tool_recommendation_systems
    level: 2
    loadBearingFor:
    - primitive: cosine similarity + length-weighted pooling
      role: retrieval math
      week: 31
    - primitive: IDF-weighted token scoring
      role: chunk and lexical scoring
      week: 36
    - primitive: Recall@K, MRR, NDCG evaluation
      role: ranking metrics
      week: 39
    - primitive: graph traversal + hop decay
      role: retrieval patterns
      week: 77
    - primitive: dynamic noise-floor filtering
      role: retrieval evaluation
      week: 78
    - primitive: Adamic-Adar for tool graph
      role: agent foundations
      week: 81
    - primitive: operational telemetry into ranking
      role: monitoring
      week: 86
    - primitive: multi-signal router
      role: traffic routing
      week: 94
    - primitive: type affinity for tenant policies
      role: quotas and priority
      week: 97
    - capstone: 3
      primitive: OpenRouter gateway as multi-signal recommender
      role: capstone integration
    pairEnforcement: strict
    parallelTrack: true
    primaryArtifacts:
    - SEARCH
    - SNOWFLAKE
    seam: multi-signal recommendation over graph + embedding + metadata
    selectionRationale: The pair is the seam philosophy applied to recommendation systems. SEARCH.md introduces the elegant
      math (graph traversal, hop decay, Adamic-Adar, IDF, type affinity, dynamic thresholds, and multi-signal combination)
      at Level 2. SNOWFLAKE.md implements that same theory in production Snowflake SQL and exposes where the math dies on
      contact with AI_EMBED permissions, recursive-CTE cycle prevention, Cortex Search latency, and Snowflake credit burn.
      The spine covers every primitive implicitly (W31, W36, W39, W77, W78, W81, W86, W94, W97) but never formalizes their
      combination, so this opt-in track makes it load-bearing without adding another spine phase.
    shortName: recommender
    tier: optional
    title: Tool Recommendation Systems
  DEEP_DIVES:
  - TOOL_RECOMMENDATION_SYSTEMS
