  FORGE_BOSSES:
  - name: Week 18 — Numerical matrix boss
    description: Gaussian elimination, matrix exponentiation, or randomized SVD with numerical-stability notes.
  - name: Week 30 — Foundations mini-contest
    description: Expectation DP, combinatorics, modular arithmetic, and one optimization search problem.
  - name: Week 45 — Data-structure mini-contest
    description: Fenwick/segment tree, DSU, hashing, and a range-query workload.
  - name: Week 57 — Graph/flow boss
    description: Euler indexing plus a flow or matching formulation for scheduling/resource allocation.
  - name: Week 69 — MLOps algorithm boss
    description: Experiment assignment, greedy rollout, or bandit allocation with a correctness and trade-off report.
  - name: Week 81 — String/agent boss
    description: Aho–Corasick tool/prompt detector or sequence-DP planner.
  - name: Week 93 — Inference boss
    description: Priority scheduling, interval allocation, and binary search on capacity backed by a benchmark.
  - name: Week 102 — Platform tree boss
    description: Euler Tour plus DSU-on-Tree subtree analytics, used as preparation for Capstone 2.
  - name: Weeks 103–108 — Capstone 1
    description: Mo’s algorithm over immutable LLM traces — the required algorithmic capstone.
  - name: Week 108 optional — Capstone 2
    description: Euler Tour + DSU on Tree over agent execution trees. Extra depth credit, not required for the LLM Platform
