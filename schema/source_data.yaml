forge:
  FORGE_TIERS:
  - level: Core
    treatment: Recurring Friday skill that directly supports the current phase
    timebox: 45–90 min
    rule: Implement, test, explain complexity and trade-offs
  - level: Supporting
    treatment: Guided lab or one representative problem
    timebox: 45–120 min
    rule: Attempt when relevant; record the result and what remains unclear
  - level: Archive
    treatment: Reference material for future use or unusual interview prompts
    timebox: 0 min scheduled
    rule: No weekly obligation; promote it only when a project needs it
  - level: Boss fight
    treatment: A selected advanced problem integrated with a gate or capstone
    timebox: 2–3 hr
    rule: Complete the artifact, write the reasoning, and include a retrospective
  FORGE_LANES:
  - weeks: 1–6
    theme: Complexity, arrays, prefix sums, two pointers, binary search, bitmasks
    tier: Core
    artifact: Timed implementation drill with complexity note
  - weeks: 7–14
    theme: Matrix multiplication, Gaussian elimination, matrix exponentiation, recurrences
    tier: Core
    artifact: From-scratch matrix or recurrence solver
  - weeks: 15–22
    theme: Numerical methods, binary search on answer, ternary search, Newton iteration
    tier: Supporting
    artifact: Root-finding or optimization comparison
  - weeks: 23–30
    theme: Probability simulation, expectation DP, combinatorics, inclusion-exclusion, number theory basics
    tier: Core
    artifact: Expectation/counting lab; Week 30 mini-contest
