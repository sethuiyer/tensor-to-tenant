# Leetcode Darbar - parallel timed problem-solving lane.
# Per T1.2 / T1.6: schema discipline with tier / level / seam /
# cross_references on each entry. Darbar is parallel to the spine,
# not part of it (Auror track is optional).

- id: darbar-catalog
  title: LeetCode Darbar
  url: https://aninokuma.codeberg.page/leetcode-darbar/
  total_slots: 548
  difficulty_breakdown:
    easy: 255
    medium: 240
    hard: 53
  tagline: 548 hand-crafted picks covering the full data-structure and algorithm spectrum.
  tier: optional
  level: 2
  seam: parallel interview lane
  selection_rationale: Parallel, timed, problem-solving lane. The 108-week core never depends on Darbar; Auror track is opt-in
    depth. Standard learners solve 3-5 problems per week aligned to the active phase.
  load_bearing_for: []
  cross_references:
  - track: forge
    role: shares algorithmic depth
  - track: darbar
    role: self-paced interview prep
- id: darbar-pattern-timed-routing
  name: Timed routing
  weeks: 1-15
  slots: 1-120
  tips: Two-pointer scanning, map-based lookups, prefix products, interval merging
  warmup: LeetCode-style easy problems (15 min each)
  core: Data-structure and string/array basics under a clock
  exam: Weekly timed block, 3-5 problems in 60 minutes
  tier: core
  level: 1
  seam: parallel interview lane
  selection_rationale: First block. Sets the weekly cadence (3-5 problems per week) and builds the timed-block habit before
    the spine introduces more demanding material.
  load_bearing_for:
  - 1
  - 15
  cross_references:
  - entity: phases
    phase_id: phase-1
    role: covers weeks 1-6
  - entity: phases
    phase_id: phase-2
    role: covers weeks 7-15
- id: darbar-pattern-state-machines
