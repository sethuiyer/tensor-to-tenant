- id: capstone-3
  number: 3
  slug: ai-gateway
  kind: alternative
  chip: Gateway
  chip_class: chip--violet
  title: "Capstone 3 - Enterprise Multi-Model AI Gateway"
  subtitle: "OpenRouter-inspired control + request plane"
  weeks: "Weeks 103–108 · alternative"
  image: /images/capstone3_enterprise_ai_gateway.webp
  description: >-
    An OpenRouter-inspired final capstone: design and build the control plane,
    request plane, routing policy, reliability layer, enterprise tenancy, and
    economics behind a unified multi-model AI gateway.
  points:
    - "One API → many models and providers"
    - "Policy-compliant, explainable routing"
    - "Stream-safe failover, idempotency, admission"
    - "Append-only usage and cost ledger"
    - "24-point rubric, PII-safe observability"
  prose_source: CAPSTONE3_OPENROUTER.md
  artifact_type: enterprise_gateway
  promises:
    - { label: one API, desc: "a normalized endpoint that hides provider-specific wire formats" }
    - { label: many models and providers, desc: "a versioned registry of capabilities, regions, prices, and health" }
    - { label: policy-compliant routing, desc: "filter by capability, region, data policy, allowlist, budget, and health" }
    - { label: reliable streaming and failover, desc: "pre-token failover; post-token error, never silent replay" }
    - { label: tenant isolation and fair admission, desc: "per-workspace budgets, concurrency, priority, fencing" }
    - { label: exact usage and cost evidence, desc: "append-only idempotent ledger, deterministic settlement" }
    - { label: enterprise controls and operational trust, desc: "SSO, guardrails, audit, SLAs, invoicing boundaries" }
  failure_matrix:
    - id: provider-timeout-before-tokens
      failure: Provider timeout before tokens
      expected_behavior: Retry/fail over within bounded retry budget
    - id: provider-disconnect-after-first-token
      failure: Provider disconnect after first token
      expected_behavior: Do not transparently replay; emit stream error and partial-attempt event
    - id: no-compliant-provider
      failure: No provider meets ZDR/region policy
      expected_behavior: Fail closed; explain rejected candidates
    - id: duplicate-idempotency-key
      failure: Duplicate idempotency key
      expected_behavior: Return/reconcile the original logical request according to contract
    - id: workspace-budget-exhausted
      failure: Workspace budget exhausted
      expected_behavior: Reject before provider dispatch
    - id: tenant-concurrency-saturated
      failure: Tenant concurrency saturated
      expected_behavior: Queue, reject, or shed according to priority policy
    - id: leader-lease-expires-mid-admission
      failure: Leader lease expires mid-admission
      expected_behavior: Fencing prevents stale owner from committing admission
    - id: provider-price-changes
      failure: Provider price changes
      expected_behavior: New version applies to new decisions; old ledger remains reproducible
    - id: malformed-provider-usage
      failure: Malformed provider usage
      expected_behavior: Quarantine settlement and alert; never invent silent cost
    - id: pii-appears-in-payload
      failure: PII appears in payload
      expected_behavior: Redact or reject before durable trace emission
  interview_questions:
    - "Why is the gateway valuable if providers already expose APIs?"
    - "What must be strongly consistent, and what can be eventually consistent?"
    - "How do you prove a fallback did not violate data policy?"
    - "When is retrying a stream unsafe?"
    - "How do you prevent one tenant from buying all provider capacity?"
    - "How do you reconcile provider usage with customer invoices?"
    - "Which features should be bought from an identity, billing, or observability vendor?"
  rubric:
    points: 24
    dimensions:
      - product boundary
      - API normalization
      - registry
      - routing
      - data policy
      - reliability
      - tenancy
      - accounting
      - observability
      - security
      - benchmark
      - staff defense
    scoring: "Score each dimension 0–2."
    passing: "18/24, no zero in policy, reliability, tenancy, or accounting, and a complete evidence bundle."
