- id: design-pattern-rate-limiter
  pattern: Rate limiter
  problem: One user or tenant floods the API
  solution: Token bucket or sliding window; distributed counter for horizontal scale
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-caching-lru-ttl
  pattern: Caching (LRU, TTL)
  problem: Repeat reads on the same keys
  solution: Cache-aside with bounded size; TTL plus write-through/invalidation
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-consistent-hashing
  pattern: Consistent hashing
  problem: Rehashing a hash table when nodes join/leave
  solution: Hash ring so a membership change moves only a fraction of keys
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-read-replicas
  pattern: Read replicas
  problem: Read traffic outpaces a single primary
  solution: Primary for writes, replicas for reads; handle replication lag
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-queue-+-workers
  pattern: Queue + workers
  problem: Slow or bursty async work
  solution: Durable queue with consumer groups and retries with backoff
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-idempotency-keys
  pattern: Idempotency keys
  problem: Client retries create duplicate effects
  solution: Store request key and result; replay the original outcome
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-circuit-breaker
  pattern: Circuit breaker
  problem: A downstream dependency is failing
  solution: Open the circuit after a threshold, fail fast, then probe
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-feature-flags
  pattern: Feature flags
  problem: Deploying risky code to everyone at once
  solution: Dynamic flag rules with gradual rollout and kill switch
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-replication-+-leader-election
  pattern: Replication + leader election
  problem: The sealer/scheduler must be a single writer
  solution: Lease-based election with fencing so stale leaders cannot commit
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
- id: design-pattern-append-only-ledger
  pattern: Append-only ledger
  problem: Audit and billing require exact history
  solution: Immutable event log; materialize dashboards separately
  tier: core
  level: 2
  seam: design patterns
  selection_rationale: Canonical pattern for system-design trade-off practice.
