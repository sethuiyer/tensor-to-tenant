# Canonical resource list for tensor-to-tenant.
#
# Schema discipline (T1.8 / T1.8.e / T1.8.f / T1.8.g / T1.8.h / T1.8.i):
#   - Every entry has a non-empty `selection_rationale` (P-principle 2).
#   - Every entry has `tier: core|optional|archive`.
#   - Every entry has `level: 1|2|3` (Level 3 = know-when-breaks).
#   - Every entry has `week` placement (or `null` for prerequisites).
#   - Every entry has `seam` (which structural seam it exposes).
#   - Every entry has `cross_references` pointing at load-bearing weeks.
#   - Drift check (T1.6) fails CI if any required field is missing.
#
# Paper discovery process: T1.8.a is the initial 12-paper mandatory
# spine. T1.8.g adds MOPD as the training-domain instance of
# P-principle 3. T1.8.i resolves the first pending entry. New entries
# follow the same flow (T1.8.h).

# ============================================================================
# T1.8.a — Core additions (12 papers, mandatory spine)
# ============================================================================

- id: beyond_self_knowledge_uncertainty_propagation
  title: "Beyond Self-Knowledge: Propagating Uncertainty Across Reasoning and Retrieval in LLMs"
  venue: "arXiv"
  year: 2024
  url: ""
  tier: core
  level: 3
  seam: "calibration -> uncertainty -> retrieval routing -> cost/quality"
  selection_rationale: >
    A beautiful bridge spanning four of the seam-philosophy's recurring
    seams in a single paper. Calibration (W38) becomes uncertainty (W38),
    which drives retrieval routing (W76), which trades off cost against
    quality. Reinforces that local confidence is not the same as
    global answer reliability. Direct cross-cutting insight for the
    RAG evaluation weeks (W76-W78).
  load_bearing_for: [38, 76, 78]
  cross_references:
    - { week: 38, role: "calibration prerequisite" }
    - { week: 76, role: "retrieval routing" }
    - { week: 78, role: "retrieval eval connection" }

- id: dynamic_exploration_graph_ann
  title: "Dynamic Exploration Graph: Efficient NN Search in Evolving Multimedia Datasets"
  venue: "arXiv"
  year: 2024
  url: ""
  tier: core
  level: 3
  seam: "static ANN index assumptions meet evolving corpora"
  selection_rationale: >
    The current ANN material in the curriculum (HNSW, IVF-PQ) is mostly
    static-index thinking. Production corpora insert, delete, and evolve
    continuously. This paper exposes the seam: the algorithmic
    assumptions of HNSW-like structures break under continuous
    modification, requiring a different index structure.
  load_bearing_for: [75]
  cross_references:
    - { week: 75, role: "primary_index_concern" }

- id: qasp_query_adaptive_vector_search
  title: "QASP: Query-Adaptive Robust Vector Search Policy"
  venue: "arXiv"
  year: 2024
  url: ""
  tier: core
  level: 3
  seam: "fixed ef_search hides query-level variance"
  selection_rationale: >
    Fixed ANN parameters (ef_search, nprobe) hide query-level variance
    and force a single recall/latency trade-off across all queries.
    QASP forces per-query adaptation, which is the same shape as the
    slice-based evaluation discipline the curriculum teaches at W39
    and W78. Benchmark deliverables should compare fixed vs adaptive
    by query-difficulty slice.
  load_bearing_for: [75]
  cross_references:
    - { week: 75, role: "primary_index_concern" }
    - { week: 39, role: "slice-evaluation precedent" }
    - { week: 78, role: "slice-evaluation precedent" }

