  venue: "arXiv 2606.30406"
  year: 2026
  url: "https://arxiv.org/abs/2606.30406"
  tier: optional
  level: 3
  seam: "multi-domain post-training integration"
  selection_rationale: >
    MOPD exposes the seam between per-domain RL specialization and
    integrated capability: independent domain experts do not naturally
    compose into a globally capable student. The paper's response
    (on-policy distillation with token-level teacher feedback, plus
    decoupled parallel teacher development) is a structurally
    interesting answer that extends the local-not-global thesis into
    the post-training domain. Industrial-scale deployment in
    MiMo-V2-Flash makes the seam real rather than theoretical. The
    "specialised teachers -> unified student" pattern recurs across
    the curriculum (microservices, multi-tenant platforms,
    multi-agent orchestration, multi-provider gateways); this paper
    is its training-domain instance.
  load_bearing_for: [73, "capstone-3"]
