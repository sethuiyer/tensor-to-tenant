# Algorithmic Forge — the parallel Friday algorithmic spine.
# Per T1.2 / T1.6: schema discipline. The Forge runs alongside the spine
# every Friday; lanes are mapped to weeks 1-108.

# ============================================================================
# Tiers (4 levels)
# ============================================================================

- id: forge-tier-core
  level: Core
  treatment: Recurring Friday skill that directly supports the current phase
  timebox: "45–90 min"
  rule: Implement, test, explain complexity and trade-offs
  tier: core
  level_note: "1"
  seam: weekly algorithmic drill
  selection_rationale: >
    Default tier. Core drills are the recurring Friday workout that
    keeps algorithmic fluency aligned with the active phase.
  load_bearing_for: []
  cross_references: []

- id: forge-tier-supporting
  level: Supporting
  treatment: Guided lab or one representative problem
  timebox: "45–120 min"
  rule: Attempt when relevant; record the result and what remains unclear
  tier: core
  level_note: "2"
  seam: weekly algorithmic drill
  selection_rationale: >
    Guided depth when a phase benefits from extended practice on a
    specific pattern. Not required for the weekly cadence.
  load_bearing_for: []
  cross_references: []

- id: forge-tier-archive
  level: Archive
  treatment: Reference material for future use or unusual interview prompts
  timebox: "0 min scheduled"
  rule: No weekly obligation; promote it only when a project needs it
  tier: core
  level_note: "3"
  seam: weekly algorithmic drill
  selection_rationale: >
    On-demand reference. Not in the weekly rotation; promoted when a
    capstone or interview needs it.
  load_bearing_for: []
  cross_references: []

- id: forge-tier-boss-fight
  level: Boss fight
  treatment: A selected advanced problem integrated with a gate or capstone
  timebox: "2–3 hr"
  rule: Complete the artifact, write the reasoning, and include a retrospective
  tier: core
  level_note: "3"
  seam: weekly algorithmic drill
  selection_rationale: >
    Selected advanced problems integrated with milestone gates or
    capstones. Ten scheduled boss fights across the 108 weeks.
  load_bearing_for: ["capstone-1", "capstone-2"]
  cross_references:
    - { entity: capstones, capstone_id: 1, role: "Mo's algorithm required" }
    - { entity: capstones, capstone_id: 2, role: "Euler + DSU on Tree optional" }

